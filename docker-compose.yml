services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:2.17.0
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
      - "${NPM_PORT}:81"
      - "${HTTPS_PORT}:443"
      - "8080:8080"
    environment:
      TZ: ${TZ}
      DB_SQLITE_FILE: /data/database.sqlite
    volumes:
      - ./data/npm:/data
      - ./data/letsencrypt:/etc/letsencrypt
    networks:
      - core-network

  portainer:
    image: portainer/portainer-ee:2.45.3
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT}:9000"
    environment:
      TZ: ${TZ}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    networks:
      - core-network

  mariadb:
    image: mariadb:11
    container_name: mariadb
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --innodb-buffer-pool-size=${MARIADB_BUFFER_POOL}
    ports:
      - "${MARIADB_PORT}:3306"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - core-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      - mariadb
    networks:
      - core-network

  dozzle:
    image: amir20/dozzle:v11.4.3
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "${DOZZLE_PORT}:8080"
    environment:
      TZ: ${TZ}
      DOZZLE_LEVEL: ${DOZZLE_LEVEL}
      DOZZLE_REMOTE_AGENT: 192.168.0.100:7007
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dozzle:/data
    networks:
      - core-network

networks:
  core-network:
    name: core-network
    driver: bridge
